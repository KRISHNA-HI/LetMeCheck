name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify build environment variables
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || vars.VITE_TMDB_API_KEY || secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
        run: |
          MISSING_VARS=0
          
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing required build variable: VITE_SUPABASE_URL (or SUPABASE_URL). Please configure it in your GitHub repository Secrets or Variables."
            MISSING_VARS=1
          else
            echo "✓ VITE_SUPABASE_URL is configured (length: ${#VITE_SUPABASE_URL} chars)"
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing required build variable: VITE_SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_ANON_KEY / SUPABASE_ANON_KEY / SUPABASE_PUBLISHABLE_KEY). Please configure it in your GitHub repository Secrets or Variables."
            MISSING_VARS=1
          else
            echo "✓ VITE_SUPABASE_PUBLISHABLE_KEY is configured (length: ${#VITE_SUPABASE_PUBLISHABLE_KEY} chars)"
          fi

          if [ -z "$VITE_TMDB_API_KEY" ]; then
            echo "::warning::VITE_TMDB_API_KEY (or TMDB_API_KEY) is not set in GitHub repository Secrets/Variables. Live TMDB Trending and New Releases will show an unavailable notice in the browser until configured."
          else
            echo "✓ VITE_TMDB_API_KEY is configured (length: ${#VITE_TMDB_API_KEY} chars)"
          fi

          if [ $MISSING_VARS -ne 0 ]; then
            echo ""
            echo "=========================================================================="
            echo "DEPLOYMENT HALTED: Missing required Supabase client variables at build time."
            echo "Vite embeds VITE_* environment variables into the static bundle during compilation."
            echo ""
            echo "To fix this error, add the following to your GitHub repository:"
            echo "  1. Go to: Settings -> Secrets and variables -> Actions"
            echo "  2. Add Repository Secret or Variable:"
            echo "     - Name: VITE_SUPABASE_URL"
            echo "     - Name: VITE_SUPABASE_PUBLISHABLE_KEY (or VITE_SUPABASE_ANON_KEY)"
            echo "     - Name: VITE_TMDB_API_KEY (or TMDB_API_KEY)"
            echo "=========================================================================="
            exit 1
          fi

      - name: Build Vite application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL || secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          VITE_TMDB_API_KEY: ${{ secrets.VITE_TMDB_API_KEY || vars.VITE_TMDB_API_KEY || secrets.TMDB_API_KEY || vars.TMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || vars.TMDB_API_KEY || secrets.VITE_TMDB_API_KEY || vars.VITE_TMDB_API_KEY }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
